<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GT16E</title>
<style>
  :root { --bg: #111; --fg: #eee; --muted: #888; --card: #1c1c1c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  header { padding: 20px 16px 8px; display: flex; align-items: baseline; gap: 12px; }
  h1 { margin: 0; font-size: 1.4rem; font-weight: 600; }
  header span { color: var(--muted); font-size: .9rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; padding: 16px; }
  .grid figure { margin: 0; background: var(--card); border-radius: 6px; overflow: hidden; cursor: zoom-in; }
  .grid img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; transition: transform .2s; }
  .grid figure:hover img { transform: scale(1.04); }
  .grid figcaption { font-size: .75rem; color: var(--muted); padding: 4px 8px; }
  .grid figcaption .file { display: block; }
  .grid figcaption .desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--fg); margin-top: 2px; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.95); display: none; align-items: center; justify-content: center; z-index: 10; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 88vh; object-fit: contain; }
  .lightbox .caption { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; padding: 0 56px; color: var(--muted); font-size: .9rem; }
  .lightbox button { position: absolute; background: none; border: 0; color: #fff; font-size: 2.5rem; cursor: pointer; padding: 16px; opacity: .7; }
  .lightbox button:hover { opacity: 1; }
  .prev { left: 0; top: 50%; transform: translateY(-50%); }
  .next { right: 0; top: 50%; transform: translateY(-50%); }
  .close { top: 0; right: 0; font-size: 2rem !important; }
</style>
</head>
<body>
<header><h1>GT16E</h1><span id="count"></span></header>
<main class="grid" id="grid"></main>

<div class="lightbox" id="lightbox">
  <button class="close" aria-label="Close">&times;</button>
  <button class="prev" aria-label="Previous">&#8249;</button>
  <img id="lbImg" alt="">
  <button class="next" aria-label="Next">&#8250;</button>
  <div class="caption" id="lbCaption"></div>
</div>

<script>
// Photo list and descriptions are loaded from photos.json (served over HTTP; file:// is blocked by browsers)
const grid = document.getElementById("grid");
const lightbox = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbCaption = document.getElementById("lbCaption");
let photos = [];
let current = 0;

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render() {
  document.getElementById("count").textContent = photos.length + " photos";
  photos.forEach((p, i) => {
    const desc = p.description || "";
    const fig = document.createElement("figure");
    fig.title = desc || p.file;
    fig.innerHTML = '<img loading="lazy" src="' + escapeHtml(p.file) + '" alt="' + escapeHtml(desc || p.file) + '">' +
      '<figcaption><span class="file">' + escapeHtml(p.file) + '</span>' +
      (desc ? '<span class="desc">' + escapeHtml(desc) + '</span>' : '') + '</figcaption>';
    fig.addEventListener("click", () => open(i));
    grid.appendChild(fig);
  });
}

function open(i) {
  current = (i + photos.length) % photos.length;
  const p = photos[current];
  lbImg.src = p.file;
  lbImg.alt = p.description || p.file;
  lbCaption.textContent = (p.description ? p.description + "  —  " : "") + p.file + "  (" + (current + 1) + " / " + photos.length + ")";
  lightbox.classList.add("open");
}

function close() { lightbox.classList.remove("open"); }

lightbox.querySelector(".prev").addEventListener("click", e => { e.stopPropagation(); open(current - 1); });
lightbox.querySelector(".next").addEventListener("click", e => { e.stopPropagation(); open(current + 1); });
lightbox.querySelector(".close").addEventListener("click", close);
lightbox.addEventListener("click", e => { if (e.target === lightbox) close(); });

document.addEventListener("keydown", e => {
  if (!lightbox.classList.contains("open")) return;
  if (e.key === "ArrowLeft") open(current - 1);
  else if (e.key === "ArrowRight") open(current + 1);
  else if (e.key === "Escape") close();
});

fetch("photos.json")
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(data => { photos = data.photos; render(); })
  .catch(err => {
    grid.textContent = "Unable to load photos.json (" + err.message + "). Open this page through a web server, not file://.";
  });
</script>
</body>
</html>
